<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording</title>
    <link rel="stylesheet" href="./pill.css" />
  </head>
  <body>
    <div id="pill" class="pill" role="group" aria-label="Recording controls">
      <!-- The bar, with the buttons. Everything but the buttons drags the window. -->
      <div id="main" class="row">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <span id="rec" class="rec">REC</span>
        <span id="timer" class="timer" role="timer" aria-label="Recorded time">00:00</span>
        <!-- Said in words for a few seconds when a button cannot do what was asked. -->
        <span id="note" class="note" role="status" hidden></span>
        <!-- Icons are from lucide. These buttons stay out of the Tab order: the pill never takes focus. -->
        <button
          id="mic"
          class="btn media"
          type="button"
          tabindex="-1"
          title="Mute microphone"
          aria-label="Mute microphone"
          aria-pressed="false"
        >
          <svg id="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19v3" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <rect x="9" y="2" width="6" height="13" rx="3" />
          </svg>
          <svg id="icon-mic-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M12 19v3" />
            <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
            <path d="M16.95 16.95A7 7 0 0 1 5 12v-2" />
            <path d="M18.89 13.23A7 7 0 0 0 19 12v-2" />
            <path d="m2 2 20 20" />
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12" />
          </svg>
        </button>
        <button
          id="camera"
          class="btn media"
          type="button"
          tabindex="-1"
          title="Turn camera off"
          aria-label="Turn camera off"
          aria-pressed="false"
        >
          <svg id="icon-camera" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
            <rect x="2" y="6" width="14" height="12" rx="2" />
          </svg>
          <svg id="icon-camera-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196" />
            <path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" />
            <path d="m2 2 20 20" />
          </svg>
        </button>
        <button id="toggle" class="btn" type="button" title="Pause" aria-label="Pause">
          <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14M16 5v14" />
          </svg>
          <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M7 4.5v15l12-7.5z" />
          </svg>
        </button>
        <button
          id="stop"
          class="btn stop"
          type="button"
          title="Stop and save"
          aria-label="Stop and save"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
        <button
          id="discard"
          class="btn"
          type="button"
          title="Discard recording"
          aria-label="Discard recording"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3" />
          </svg>
        </button>
      </div>
      <!-- Asked in place, so nothing is deleted until the person says so here. -->
      <div id="confirm" class="row" hidden>
        <span class="ask">Discard recording?</span>
        <button id="keep" class="btn text" type="button">Keep</button>
        <button id="yes" class="btn text danger" type="button">Discard</button>
      </div>
    </div>
    <script type="module" src="../recorder/pill/page/main.ts"></script>
  </body>
</html>
