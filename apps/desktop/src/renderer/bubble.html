<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera</title>
    <link rel="stylesheet" href="./bubble.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <!-- The round picture. The whole circle drags the window. -->
      <div id="bubble" class="bubble" role="img" aria-label="Your camera, as it is recorded">
        <video id="video" autoplay muted playsinline></video>
      </div>
      <!-- Follows the microphone: bigger and brighter when there is sound. -->
      <div id="dot" class="dot" aria-hidden="true"></div>
    </div>
    <script type="module" src="../recorder/bubble/page/main.ts"></script>
  </body>
</html>
