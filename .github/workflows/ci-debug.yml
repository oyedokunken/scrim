name: ci-debug

on:
  push:
    branches: [fix/ci-green]
    paths:
      - '.github/workflows/ci-debug.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: built-by alone
            specs: tests/e2e/built-by.spec.ts
          - name: chooser 1 then built-by
            specs: tests/e2e/area-chooser.spec.ts:139 tests/e2e/built-by.spec.ts
          - name: chooser 1 and 2 then built-by
            specs: tests/e2e/area-chooser.spec.ts:139 tests/e2e/area-chooser.spec.ts:162 tests/e2e/built-by.spec.ts
          - name: chooser 1 to 3 then built-by
            specs: tests/e2e/area-chooser.spec.ts tests/e2e/built-by.spec.ts
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm fetch:ffmpeg
      - run: pnpm build
      - name: ${{ matrix.name }}
        run: pnpm exec playwright test ${{ matrix.specs }}
