name: e2e-desktop

# Windows is the gate. The linux and macos jobs are allowed to fail until they have run once.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'tools/icons.mts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'tools/icons.mts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-desktop.yml'

permissions:
  contents: read

concurrency:
  group: e2e-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Regenerate the icons and fail on any difference
        working-directory: .
        run: |
          pnpm icons
          git diff --exit-code -- apps/desktop/resources apps/landing/src/app/icon.svg packages/tokens/src/mark.ts

      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Fetch the bundled FFmpeg
        run: pnpm fetch:ffmpeg

      # Temporary: says whether Electron itself starts on this runner, and what Scrim prints if it does not.
      - name: Diagnose the launch
        continue-on-error: true
        shell: pwsh
        run: |
          pnpm build
          Set-Content -Path "$env:RUNNER_TEMP/bare-main.js" -Value "console.log('bare electron ok', process.versions.electron); require('electron').app.quit();"
          $electron = (node -p "require('electron')").Trim()
          Write-Host "electron: $electron"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $bare = Start-Process -FilePath $electron -ArgumentList "$env:RUNNER_TEMP/bare-main.js","--no-sandbox","--disable-gpu" -PassThru -Wait -RedirectStandardOutput "$env:RUNNER_TEMP/bare.out" -RedirectStandardError "$env:RUNNER_TEMP/bare.err"
          Write-Host "bare exit: $($bare.ExitCode)"
          Get-Content "$env:RUNNER_TEMP/bare.out", "$env:RUNNER_TEMP/bare.err" -ErrorAction SilentlyContinue | Select-Object -First 30
          $env:SCRIM_E2E = "1"
          $app = Start-Process -FilePath $electron -ArgumentList ".","--no-sandbox","--disable-gpu","--user-data-dir=$env:RUNNER_TEMP/diag-user" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/app.out" -RedirectStandardError "$env:RUNNER_TEMP/app.err"
          Start-Sleep -Seconds 12
          Write-Host "scrim exited: $($app.HasExited) code: $(if ($app.HasExited) { $app.ExitCode } else { 'running' })"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Content "$env:RUNNER_TEMP/app.out", "$env:RUNNER_TEMP/app.err" -ErrorAction SilentlyContinue | Select-Object -First 60

      - name: Build and run the end to end tests against the build
        run: |
          pnpm build
          pnpm test:e2e

      - name: Package an unsigned Windows installer
        run: pnpm package

      - name: Read the fuses back from the packaged binary
        run: pnpm verify:fuses release/win-unpacked/Scrim.exe

      - name: Run the end to end tests against the packaged app
        env:
          SCRIM_E2E_TARGET: packaged
        run: pnpm test:e2e

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrim-windows-unsigned
          path: apps/desktop/release/Scrim Setup *.exe
          retention-days: 3
          if-no-files-found: error

  # Unverified on purpose: these two jobs have never run. They are allowed to fail so they cannot
  # block the Windows result while the macOS and Linux paths are brought up.
  linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: |
          pnpm typecheck
          pnpm test
      - run: pnpm build
      - name: End to end tests on X11 under xvfb (Electron gets --no-sandbox from CI)
        run: xvfb-run --auto-servernum pnpm test:e2e

  macos:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: |
          pnpm typecheck
          pnpm test
