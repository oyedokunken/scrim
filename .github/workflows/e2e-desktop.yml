name: e2e-desktop

# Windows is the gate. The linux and macos jobs are allowed to fail until they have run once.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'tools/icons.mts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'tools/icons.mts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-desktop.yml'

permissions:
  contents: read

concurrency:
  group: e2e-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Regenerate the icons and fail on any difference
        working-directory: .
        run: |
          pnpm icons
          git diff --exit-code -- apps/desktop/resources apps/landing/src/app/icon.svg packages/tokens/src/mark.ts

      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Fetch the bundled FFmpeg
        run: pnpm fetch:ffmpeg

      # The built app, run from source, takes FFmpeg from the PATH, and the test fixtures make their
      # videos with libx264. The bundled build is LGPL and has no libx264, so the tests use a full
      # FFmpeg from the runner. The packaged app below still runs its own bundled build.
      - name: Install a full FFmpeg for the test fixtures
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build and run the end to end tests against the build
        shell: pwsh
        run: |
          pnpm build
          pnpm test:e2e

      - name: Package an unsigned Windows installer
        run: pnpm package --publish never

      - name: Read the fuses back from the packaged binary
        run: pnpm verify:fuses release/win-unpacked/Scrim.exe

      - name: Run the end to end tests against the packaged app
        env:
          SCRIM_E2E_TARGET: packaged
        run: pnpm test:e2e

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrim-windows-unsigned
          path: apps/desktop/release/Scrim-Setup-*.exe
          retention-days: 3
          if-no-files-found: error

  # Unverified on purpose: these two jobs have never run. They are allowed to fail so they cannot
  # block the Windows result while the macOS and Linux paths are brought up.
  linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: |
          pnpm typecheck
          pnpm test
      - run: pnpm build
      # The test fixtures need libx264, which the system FFmpeg has. The app under test must use the
      # pinned build it ships, because on Linux it encodes with libopenh264 or the graphics chip.
      - name: Install a full FFmpeg for the test fixtures, and fetch the pinned one for the app
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg openbox
          node scripts/fetch-ffmpeg.mts --target linux-x64 --out "$RUNNER_TEMP/ffmpeg"
      - name: End to end tests on X11 under xvfb (Electron gets --no-sandbox from CI)
        env:
          SCRIM_FIXTURE_FFMPEG: ffmpeg
        run: |
          export SCRIM_FFMPEG="$RUNNER_TEMP/ffmpeg/ffmpeg"
          export SCRIM_FFPROBE="$RUNNER_TEMP/ffmpeg/ffprobe"
          # A window manager gives the window the maximize, minimize and focus the tests exercise.
          xvfb-run --auto-servernum bash -c 'openbox & sleep 2; pnpm test:e2e'

      # Everything below is NEW and has never run: it was written on a Windows machine. Read the
      # logs of the first run, and fix the step, not the check. docs/releasing.md says what a
      # runner can and cannot prove.

      # NEW. The LGPL FFmpeg from the pin, then its licence, its encoder list and a real software
      # H.264 plus AAC encode read back with ffprobe (H.264, yuv420p, the right size, AAC).
      - name: Fetch the pinned FFmpeg and check its licence and software encode
        run: |
          node scripts/fetch-ffmpeg.mts
          node scripts/check-encode.mts

      # NEW. Package both Linux targets, then read the fuses back from the Linux binary.
      - name: Package the AppImage and the deb
        run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never --config electron-builder.config.ts
      - name: Read the fuses back from the Linux binary
        run: pnpm verify:fuses release/linux-unpacked/scrim

      # NEW. The deb as a package: its fields, its files, and no way to switch the sandbox off.
      - name: Inspect the deb
        run: |
          deb="$(ls release/*.deb)"
          dpkg-deb -f "${deb}" Package Version Architecture Depends
          dpkg-deb -f "${deb}" Depends | grep -q 'libx11-6'
          dpkg-deb -f "${deb}" Depends | grep -q 'libxtst6'
          dpkg-deb -c "${deb}" > deb-files.txt
          grep -q 'usr/share/applications/scrim.desktop' deb-files.txt
          grep -q 'usr/share/icons/hicolor/.*/apps/scrim.png' deb-files.txt
          grep -q 'opt/Scrim/resources/apparmor-profile' deb-files.txt
          grep -q 'opt/Scrim/resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/linux-x64/uiohook-napi.node' deb-files.txt

      # NEW. Install, check the profile and the desktop entry, start the installed app on a virtual
      # display WITHOUT --no-sandbox (the AppArmor profile is what lets the sandbox start on
      # Ubuntu 24.04), then uninstall and check that no Scrim file is left behind.
      - name: Install the deb, start it with the sandbox on, uninstall it
        run: |
          sudo apt-get install -y ./release/*.deb
          test -x /usr/bin/scrim
          test -f /etc/apparmor.d/scrim
          grep -q '^Exec=' /usr/share/applications/scrim.desktop
          if grep -q 'no-sandbox' /usr/share/applications/scrim.desktop; then exit 1; fi
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          xvfb-run --auto-servernum bash -c 'scrim > "$RUNNER_TEMP/scrim.log" 2>&1 & pid=$!; sleep 20; if kill -0 "$pid" 2>/dev/null; then echo "Scrim is running with the sandbox on."; kill "$pid"; else echo "Scrim exited early."; cat "$RUNNER_TEMP/scrim.log"; exit 1; fi'
          sudo apt-get remove -y scrim
          test ! -e /opt/Scrim
          test ! -e /usr/bin/scrim
          test ! -e /etc/apparmor.d/scrim
          test ! -e /usr/share/applications/scrim.desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrim-linux-unsigned
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          retention-days: 3
          if-no-files-found: error

  macos:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: |
          pnpm typecheck
          pnpm test
