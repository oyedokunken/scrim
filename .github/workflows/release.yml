name: release

# On a v* tag: build the installers on all three systems and publish them to GitHub Releases with
# a SHA256SUMS.txt file. See docs/releasing.md for the order of a release and what is verified.
# Written while GitHub Actions billing was off, so this file has never run. Treat the first run as
# a test and read its logs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.18.0

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag must match the desktop version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop version ${version}." >&2
            exit 1
          fi

  windows:
    needs: verify-tag
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Signing turns on only when its secrets exist and only for a tag build in the main
      # repository. Otherwise the installer is built unsigned and the summary says so.
      - name: Decide how to sign
        id: sign
        run: node build/signing-cli.mts
      - name: Package
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: pnpm package
      - run: pnpm verify:fuses release/win-unpacked/Scrim.exe
      # SignPath signs the finished installer, so it needs the installer as a workflow artifact.
      - name: Upload the unsigned installer for SignPath
        if: steps.sign.outputs.mode == 'signpath'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows
          path: apps/desktop/release/Scrim Setup *.exe
          if-no-files-found: error
      - name: Sign the installer with SignPath
        if: steps.sign.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/Integrations/GitHub
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/signed
      - name: Replace the installer with the signed one
        if: steps.sign.outputs.mode == 'signpath'
        run: |
          Remove-Item "release/Scrim Setup *.exe"
          Copy-Item "signed/*.exe" release/
      # If signing was on, a bad signature fails the release. The installer, and for the built in
      # providers also the app and FFmpeg, must carry a valid, timestamped signature.
      - name: Verify the signatures
        if: steps.sign.outputs.enabled == 'true'
        env:
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
        run: |
          $files = @((Get-ChildItem "release/Scrim Setup *.exe").FullName)
          if ($env:SIGN_MODE -ne 'signpath') {
            $files += (Resolve-Path "release/win-unpacked/Scrim.exe").Path
            $files += (Resolve-Path "release/win-unpacked/resources/ffmpeg/ffmpeg.exe").Path
          }
          if ($env:WIN_PUBLISHER_NAME) {
            node build/verify-signature.mts --publisher "$env:WIN_PUBLISHER_NAME" @files
          } else {
            node build/verify-signature.mts @files
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: apps/desktop/release/Scrim Setup *.exe
          if-no-files-found: error

  macos:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build the pinned LGPL FFmpeg for this architecture
        run: bash scripts/build-ffmpeg-mac.sh
      - run: pnpm build
      # Signing and notarization only happen when the secrets exist. Without them the disk image
      # is unsigned and the website says how to open it.
      - name: Package the disk image
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos-${{ matrix.arch }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  linux:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node scripts/fetch-ffmpeg.mts
      - run: pnpm build
      - run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never --config electron-builder.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Scrim ${GITHUB_REF_NAME}" --generate-notes --verify-tag
