name: release

# On a v* tag: build the installers on all three systems and publish them to GitHub Releases with
# a SHA256SUMS.txt file. See docs/releasing.md for the order of a release and what is verified.
# Written while GitHub Actions billing was off, so this file has never run. Treat the first run as
# a test and read its logs.
#
# Linux signing: the AppImage, the deb and SHA256SUMS.txt each get a detached GPG signature (.asc)
# from the owner's key (secrets LINUX_SIGNING_KEY and LINUX_SIGNING_PASSPHRASE, public key in
# docs/scrim-release-key.asc). The repository variable REQUIRE_LINUX_SIGNING, when "true", makes the
# release fail instead of publishing unsigned Linux files. See docs/releasing.md. Never run yet.
#
# Windows signing: see docs/code-signing.md. The repository variable REQUIRE_WINDOWS_SIGNING, when
# "true", makes the Windows job fail instead of building an unsigned installer, so nothing
# unsigned can publish. A manual run with dry_run builds only Windows, runs every signing step
# except the call to SignPath, and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse Windows signing without calling SignPath. Publishes nothing.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.18.0

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag must match the desktop version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop version ${version}." >&2
            exit 1
          fi

  windows:
    needs: verify-tag
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Signing turns on only when its secrets exist and only for a tag build in the main
      # repository. Otherwise the installer is built unsigned and the summary says so, unless
      # REQUIRE_WINDOWS_SIGNING is true, which makes this step fail the job.
      - name: Decide how to sign
        id: sign
        env:
          REQUIRE_WINDOWS_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
          SCRIM_SIGNING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: node build/signing-cli.mts
      # Certificate file, Azure or unsigned: electron-builder makes the installer in one go and,
      # for the first two, signs it. SignPath has its own path below.
      - name: Package
        if: steps.sign.outputs.mode != 'signpath'
        env:
          REQUIRE_WINDOWS_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
          SCRIM_SIGNING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        # --publish never: the publish job below uploads everything, so the build must not try to.
        run: pnpm package --publish never

      # SignPath path, in two requests. The program inside the installer is built before the
      # installer, so it is signed first: build the unpacked app, sign its programs, put them back,
      # build the installer from that signed app, then sign the installer.
      # The SignPath project needs two artifact configurations whose root is <zip-file>: one for
      # the staged programs (Scrim.exe, ffmpeg exe files, the win32 mouse hook .node) and one for
      # the single installer exe. Their slugs are the repository variables
      # SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG and SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG.
      # Not run yet: needs an approved SignPath project. Treat the first run as a test.
      - name: Build the unpacked app
        if: steps.sign.outputs.mode == 'signpath'
        env:
          REQUIRE_WINDOWS_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
          SCRIM_SIGNING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: pnpm package:dir
      - run: pnpm verify:fuses release/win-unpacked/Scrim.exe
      - name: Stage the programs for signing
        if: steps.sign.outputs.mode == 'signpath'
        run: node build/signing-targets.mts stage release/win-unpacked signing/app-input
      - name: Upload the unsigned programs for SignPath
        if: steps.sign.outputs.mode == 'signpath' && steps.sign.outputs.dry_run != 'true'
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-app
          path: apps/desktop/signing/app-input
          if-no-files-found: error
      - name: Sign the programs with SignPath
        if: steps.sign.outputs.mode == 'signpath' && steps.sign.outputs.dry_run != 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/Integrations/GitHub
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/signing/app-signed
      # The service returns a zip or loose files, depending on the artifact configuration. Both work.
      - name: Put the signed programs back into the app
        if: steps.sign.outputs.mode == 'signpath'
        env:
          DRY_RUN: ${{ steps.sign.outputs.dry_run }}
        run: |
          if ($env:DRY_RUN -eq 'true') {
            # Rehearsal: send the unsigned files through the same step, so its inputs are checked.
            node build/signing-targets.mts restore signing/app-input release/win-unpacked
          } else {
            Get-ChildItem signing/app-signed -Filter *.zip -ErrorAction SilentlyContinue |
              ForEach-Object { Expand-Archive -LiteralPath $_.FullName -DestinationPath signing/app-signed -Force; Remove-Item $_.FullName }
            # --expect-changed fails when a returned file is byte for byte the unsigned one.
            node build/signing-targets.mts restore signing/app-signed release/win-unpacked --expect-changed
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the signed programs
        if: steps.sign.outputs.mode == 'signpath' && steps.sign.outputs.dry_run != 'true'
        env:
          PUBLISHER: ${{ steps.sign.outputs.publisher }}
        run: |
          $files = @(node build/signing-targets.mts list release/win-unpacked)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node build/verify-signature.mts --publisher "$env:PUBLISHER" @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installer from the signed app
        if: steps.sign.outputs.mode == 'signpath'
        env:
          REQUIRE_WINDOWS_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
          SCRIM_SIGNING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: pnpm exec electron-builder --win nsis --prepackaged release/win-unpacked --publish never --config electron-builder.config.ts
      - name: Upload the unsigned installer for SignPath
        if: steps.sign.outputs.mode == 'signpath' && steps.sign.outputs.dry_run != 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-installer
          path: apps/desktop/release/Scrim-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer with SignPath
        if: steps.sign.outputs.mode == 'signpath' && steps.sign.outputs.dry_run != 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/Integrations/GitHub
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/signing/installer-signed
      - name: Replace the installer with the signed one
        if: steps.sign.outputs.mode == 'signpath' && steps.sign.outputs.dry_run != 'true'
        run: |
          Get-ChildItem signing/installer-signed -Filter *.zip -ErrorAction SilentlyContinue |
            ForEach-Object { Expand-Archive -LiteralPath $_.FullName -DestinationPath signing/installer-signed -Force; Remove-Item $_.FullName }
          $signed = @(Get-ChildItem signing/installer-signed -Filter Scrim-Setup-*.exe -Recurse)
          if ($signed.Count -ne 1) { Write-Error "Expected one signed installer, found $($signed.Count)."; exit 1 }
          Remove-Item "release/Scrim-Setup-*.exe"
          Copy-Item $signed[0].FullName release/
      # Signing changed the installer's bytes, so latest.yml must carry the hash and size of the
      # file that is published, and the blockmap of the unsigned file is dropped. In a rehearsal the
      # unsigned installer goes through the same two steps.
      - name: Write the update file for the final installer
        if: steps.sign.outputs.mode == 'signpath'
        run: |
          $installer = (Get-ChildItem "release/Scrim-Setup-*.exe").FullName
          node scripts/refresh-update-info.mts $installer release/latest.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "release/*.blockmap" -ErrorAction SilentlyContinue
          node scripts/refresh-update-info.mts --check $installer release/latest.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # If signing ran, a bad signature fails the release. The installer, and the programs inside
      # the app, must carry a valid, timestamped signature from the expected publisher.
      - name: Verify the signatures
        if: steps.sign.outputs.enabled == 'true' && steps.sign.outputs.dry_run != 'true'
        env:
          PUBLISHER: ${{ steps.sign.outputs.publisher }}
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
        run: |
          $files = @((Get-ChildItem "release/Scrim-Setup-*.exe").FullName)
          if ($env:SIGN_MODE -eq 'signpath') {
            $files += @(node build/signing-targets.mts list release/win-unpacked)
          } else {
            $files += (Resolve-Path "release/win-unpacked/Scrim.exe").Path
            $files += (Resolve-Path "release/win-unpacked/resources/ffmpeg/ffmpeg.exe").Path
          }
          if ($env:PUBLISHER) {
            node build/verify-signature.mts --publisher "$env:PUBLISHER" @files
          } else {
            node build/verify-signature.mts @files
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # A second lock besides the decision step: with signing required, nothing that was not
      # signed and verified in this run may reach the upload below, which the publish job reads.
      - name: Refuse an unsigned installer
        if: vars.REQUIRE_WINDOWS_SIGNING == 'true' && steps.sign.outputs.enabled != 'true'
        run: |
          Write-Error "Windows signing is required but the installer was not signed."
          exit 1
      # latest.yml and the blockmap are what the in-app updater reads. Without them there is no update.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: |
            apps/desktop/release/Scrim-Setup-*.exe
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  macos:
    needs: verify-tag
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build the pinned LGPL FFmpeg for this architecture
        run: bash scripts/build-ffmpeg-mac.sh
      - run: pnpm build
      # Signing and notarization only happen when the secrets exist. Without them the disk image
      # is unsigned and the website says how to open it.
      - name: Package the disk image
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.config.ts
      # Both Mac builds write latest-mac.yml, so each is renamed here and the publish job joins them.
      - name: Keep this architecture's update file apart
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.part
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac-*.part
          if-no-files-found: error

  linux:
    needs: verify-tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The LGPL FFmpeg is fetched by the pin in scripts/ffmpeg-targets.mts. A pin that is not set
      # makes this step fail with a clear message.
      - run: node scripts/fetch-ffmpeg.mts
      - run: pnpm build
      - run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never --config electron-builder.config.ts
      # The same fuse check as Windows, on the Linux binary.
      - run: pnpm verify:fuses release/linux-unpacked/scrim
      # The release has to say how it was signed. With REQUIRE_LINUX_SIGNING true this step fails
      # when the key, the passphrase or the public key file is missing.
      - name: Decide how to sign the Linux files
        id: linuxsign
        env:
          REQUIRE_LINUX_SIGNING: ${{ vars.REQUIRE_LINUX_SIGNING }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: node build/linux-signing-cli.mts decide
      # Detached signatures next to the AppImage and the deb. gpg runs in a temporary keyring that
      # is deleted afterwards, and each signature is checked against docs/scrim-release-key.asc.
      - name: Sign the AppImage and the deb
        if: steps.linuxsign.outputs.enabled == 'true'
        env:
          REQUIRE_LINUX_SIGNING: ${{ vars.REQUIRE_LINUX_SIGNING }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: node build/linux-signing-cli.mts sign release
      - name: Refuse unsigned Linux files
        if: vars.REQUIRE_LINUX_SIGNING == 'true'
        run: |
          for file in release/*.AppImage release/*.deb; do
            test -s "${file}.asc" || { echo "${file} has no signature." >&2; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.asc
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Join the two Mac update files into latest-mac.yml
        run: node source/apps/desktop/scripts/merge-mac-update-info.mts dist/latest-mac.yml dist/latest-mac-arm64.part dist/latest-mac-x64.part
      - name: Check that the update files are present
        run: |
          for file in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "dist/${file}" || { echo "${file} is missing, so the in-app updater would find nothing." >&2; exit 1; }
          done
          # The Linux update file must name the AppImage that is being published, because the AppImage
          # updates itself from it.
          names="$(sed -n -E 's/^[[:space:]-]*(url|path):[[:space:]]*//p' dist/latest-linux.yml)"
          test -n "${names}" || { echo "latest-linux.yml names no file." >&2; exit 1; }
          for name in ${names}; do
            test -f "dist/${name}" || { echo "latest-linux.yml names ${name}, which is not in the release." >&2; exit 1; }
          done
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      # SHA256SUMS.txt lists the files of all three systems, the Linux signatures included. It is
      # signed last, so its own signature is the one file it does not list.
      - name: Decide how to sign the checksums
        id: linuxsign
        env:
          REQUIRE_LINUX_SIGNING: ${{ vars.REQUIRE_LINUX_SIGNING }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: node source/apps/desktop/build/linux-signing-cli.mts decide
      - name: Sign SHA256SUMS.txt
        if: steps.linuxsign.outputs.enabled == 'true'
        env:
          REQUIRE_LINUX_SIGNING: ${{ vars.REQUIRE_LINUX_SIGNING }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: node source/apps/desktop/build/linux-signing-cli.mts sign --only=SHA256SUMS.txt dist
      # The check a user runs, on the files that are about to be published: import the committed
      # public key into an empty keyring and verify every signature.
      - name: Verify every Linux signature with the public key from the repository
        if: steps.linuxsign.outputs.enabled == 'true'
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import source/docs/scrim-release-key.asc
          for file in dist/*.AppImage dist/*.deb dist/SHA256SUMS.txt; do
            gpg --batch --verify "${file}.asc" "${file}"
          done
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
      - name: Refuse unsigned Linux files
        if: vars.REQUIRE_LINUX_SIGNING == 'true'
        run: |
          for file in dist/*.AppImage dist/*.deb dist/SHA256SUMS.txt; do
            test -s "${file}.asc" || { echo "${file} has no signature." >&2; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Scrim ${GITHUB_REF_NAME}" --generate-notes --verify-tag
