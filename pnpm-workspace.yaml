packages:
  - apps/*
  - packages/*

# Every third party version is listed once, exact. Packages use `catalog:`.
# Resolved on 2026-10-24 under a 7 day minimum release age.
catalog:
  typescript: 7.0.2
  turbo: 2.11.13
  vite: 8.3.8
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lucide-react: 1.77.0
  '@fontsource-variable/urbanist': 5.3.0
  '@fontsource/urbanist': 5.3.0
  zod: 4.6.7
  react-hook-form: 7.92.0
  '@hookform/resolvers': 7.0.7
  prisma: 7.10.1
  '@prisma/client': 7.10.1
  '@prisma/adapter-pg': 7.10.1
  nodemailer: 10.6.1
  '@types/nodemailer': 8.0.2
  server-only: 0.0.1
  vitest: 5.1.1
  '@vitest/coverage-v8': 5.1.1
  fast-check: 4.10.3
  '@playwright/test': 1.65.1
  '@axe-core/playwright': 4.14.0
  '@lhci/cli': 0.16.1
  eslint: 10.15.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.73.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.14.0
  prettier: 3.10.1
  husky: 9.1.7
  lint-staged: 17.6.1
  '@commitlint/cli': 21.2.4
  '@commitlint/config-conventional': 21.2.4
  knip: 6.46.1
  sharp: 0.35.5
  uiohook-napi: 1.5.5
  electron: 45.4.1
  electron-vite: 6.0.0
  electron-builder: 26.18.0
  electron-updater: 6.8.11
  '@vitejs/plugin-react': 6.3.0
  '@electron/fuses': 2.1.3

# Minutes. 7 days.
minimumReleaseAge: 10080

# pnpm 12 syntax for install scripts. Add an entry only after reading what the
# script does.
allowBuilds:
  electron: true
  esbuild: true
  unrs-resolver: true
  electron-winstaller: false
  sharp: true
  # Download Prisma's schema engine binary, which `prisma migrate` needs.
  prisma: true
  '@prisma/engines': true
  # Runs node-gyp-build, which loads the prebuilt binary shipped for each system.
  uiohook-napi: true

# Patched versions of transitive dependencies with open security advisories. Each is pinned exactly
# and is at least 7 days old. Remove an entry once the parent package asks for a fixed version.
overrides:
  effect: 3.22.1
  fast-uri: 3.1.9
  body-parser@<1.20.9: 1.20.9
  basic-ftp@<6.2.4: 6.2.4
  tmp@<0.2.6: 0.2.6
  uuid@<11.1.1: 11.1.1
